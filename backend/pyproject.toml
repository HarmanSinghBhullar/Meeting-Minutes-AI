[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-backend"
version = "0.1.0"
description = "Backend for the Meeting Intelligence browser extension"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",       # multipart audio chunk uploads
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",

    # Transcription
    "faster-whisper>=1.1",
    # CTranslate2 links against cuBLAS/cuDNN but does not bundle them, and Windows
    # has no system CUDA toolkit to fall back on. Without these, transcription dies
    # at the first GPU call with "cublas64_12.dll is not found". See app/core/cuda.py.
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",

    # LLM (minutes, grounding, translation). All are installed; which one runs is
    # the LLM_PROVIDER setting. They are small, pure-Python HTTP clients — carrying
    # the unused ones costs nothing and keeps provider A/B testing on the evaluation
    # set a config change rather than a reinstall.
    "groq>=0.11",
    "google-genai>=1.0",
    "openai>=1.60",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Required for the worker, optional for the API — which is the only reason it is
# an extra rather than a dependency. pyannote is now the sole source of speaker
# attribution (the DOM active-speaker scrape it replaced broke silently whenever a
# platform reskinned), so a worker without this transcribes every remote speaker
# as "Unknown". It pulls torch, which the API process has no use for.
#   pip install -e ".[diarization]"
diarization = [
    # Every bound here was paid for by an install that broke. Do not loosen one
    # without reading why it is there.
    #
    # pyannote.audio <4: 4.x renamed `Pipeline.from_pretrained(use_auth_token=)`
    # to `token=`, and moved audio I/O onto torchcodec, which needs FFmpeg's
    # *shared libraries* on the DLL search path — a second system dependency
    # beyond the ffmpeg binary this project already asks for, and one that fails
    # at import rather than at first use. Moving to 4.x is a deliberate upgrade
    # with its own testing, not something an unpinned `>=3.3` may do by itself.
    "pyannote.audio>=3.3,<4",
    # torch <2.6: 2.6 flipped `torch.load(weights_only=)` to True by default, and
    # pyannote 3.x's checkpoints pickle globals (TorchVersion, lightning types)
    # that the safe unpickler rejects — so the model fails to load at all.
    # Allowlisting the globals one at a time does not converge; the version bound
    # does. (torchaudio 2.9 separately removed `torchaudio.AudioMetaData`, which
    # pyannote 3.x imports at module scope, so <2.6 clears that too.)
    # torchaudio must match the torch it was built against.
    "torch>=2.4,<2.6",
    "torchaudio>=2.4,<2.6",
    # huggingface_hub <1: 1.0 removed the `use_auth_token` argument that
    # pyannote 3.x still passes to hf_hub_download. Fails with a TypeError the
    # moment it tries to fetch the gated weights.
    "huggingface_hub>=0.23,<1",
    # speechbrain 1.0.x: pyannote's embedding model runs on speechbrain, and 1.1
    # restructured its package into lazy submodules. Anything that introspects
    # loaded modules (pyannote does, on the way to the checkpoint) trips the lazy
    # `speechbrain.integrations.k2_fsa` import, which needs an optional dependency
    # nobody installed, and the pipeline dies on an ImportError from a module it
    # never asked for.
    "speechbrain>=1.0,<1.1",
]

# RAG is the phase-2 add-on.
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.3",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

# The repo root holds `app`, `alembic`, and `tests` side by side, which setuptools
# cannot disambiguate on its own. `app` is the only importable package.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `conftest` is this repo's own test helper module, imported bare rather than as
# `tests.conftest` (pyannote.pipeline squats on the top-level `tests` name — see
# the note in tests/test_speaker_mapping.py). Without this, isort files it under
# third-party and shuffles it in among pytest and sqlalchemy.
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
