[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-backend"
version = "0.1.0"
description = "Backend for the Meeting Intelligence browser extension"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",       # multipart audio chunk uploads
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",

    # Transcription
    "faster-whisper>=1.1",
    # CTranslate2 links against cuBLAS/cuDNN but does not bundle them, and Windows
    # has no system CUDA toolkit to fall back on. Without these, transcription dies
    # at the first GPU call with "cublas64_12.dll is not found". See app/core/cuda.py.
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",

    # LLM (minutes, grounding, translation). Both are installed; which one runs
    # is the LLM_PROVIDER setting. They are small, pure-Python HTTP clients —
    # carrying the unused one costs nothing and keeps provider A/B testing on the
    # evaluation set a config change rather than a reinstall.
    "openai>=1.60",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Kept separate: pyannote is the fallback attribution path and pulls in torch.
# Install only if you need diarization for non-browser (e.g. conference room) audio.
diarization = [
    "pyannote.audio>=3.3",
    "torch>=2.4",
]

# RAG is the phase-2 add-on.
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.3",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

# The repo root holds `app`, `alembic`, and `tests` side by side, which setuptools
# cannot disambiguate on its own. `app` is the only importable package.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
