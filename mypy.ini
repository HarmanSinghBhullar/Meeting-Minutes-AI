# Type-checking for code outside `backend/` — which today means `eval/`.
#
# Mirrors [tool.mypy] in backend/pyproject.toml (strict), with three deliberate
# differences, each of which is a workaround rather than a preference:
#
#   mypy_path = backend
#     `app` is installed editable, and mypy does not follow the .pth file that
#     makes that work at runtime. Without this, every `app` import in runner.py is
#     an unresolved-module error and checking stops before it reaches eval's own
#     code.
#
#   python_version = 3.12
#     backend pins 3.11, but numpy's bundled stubs use `type` statements that only
#     parse on 3.12+, and checking eval drags numpy in through app -> pyannote. The
#     venv is 3.12 regardless, so this matches what actually runs.
#
#   follow_imports = silent for app.*
#     eval must be held to its own standard, not made responsible for the
#     backend's. `backend/venv/Scripts/python -m mypy app` is where app's own type
#     errors belong; surfacing them here too would mean this file could never go
#     green on its own merits, and a check that is always red is a check nobody
#     reads.

[mypy]
python_version = 3.12
strict = True
mypy_path = backend
files = eval
plugins = pydantic.mypy

[mypy-app.*]
follow_imports = silent

# Third-party packages without stubs or a py.typed marker, reached through `app`.
[mypy-pyannote.*]
ignore_missing_imports = True

[mypy-faster_whisper.*]
ignore_missing_imports = True
